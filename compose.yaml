services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: linked_stations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - linked_stations_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linked_stations"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  linked_stations_pgdata:
